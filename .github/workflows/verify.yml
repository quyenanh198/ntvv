name: Verify farm upgrade

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, upgrade/farm-v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check browser scripts
        run: |
          node --check public/app.js
          node --check public/audio.js
      - name: Run automated tests
        run: npm test
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check responsive farm and order sheet
        run: npm run browser:smoke
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: farm-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser/
          if-no-files-found: ignore
      - name: Verify generated reports
        run: |
          npm run art:inventory
          npm run balance:report
          git diff --check
          git diff --exit-code -- docs/art-inventory.md docs/balance-report.md
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build production image
        run: docker build -t ntvv-verify .
