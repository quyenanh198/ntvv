<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7ecdf2" />
  <title>Nông trại vui vẻ 🌾</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Lớp trời (fixed, sau lưng mọi thứ) -->
  <div class="scenery" aria-hidden="true">
    <div class="sun"></div>
    <span class="cloud cloud-1">☁️</span>
    <span class="cloud cloud-2">☁️</span>
    <span class="cloud cloud-3">⛅</span>
  </div>

  <!-- Cảnh nông trại + logo: tĩnh ngoài #app để animation không bị reset -->
  <div class="scene-banner" aria-hidden="true">
    <svg viewBox="0 0 760 215" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
      <!-- đồi -->
      <path d="M0,125 Q120,72 260,112 T520,104 T760,92 L760,215 L0,215 Z" fill="#a8d977" opacity="0.85"/>
      <path d="M0,155 Q190,112 380,142 T760,136 L760,215 L0,215 Z" fill="#8fd14f"/>
      <!-- ao cá -->
      <ellipse cx="85" cy="188" rx="66" ry="19" fill="#6fc3ea"/>
      <ellipse cx="85" cy="185" rx="46" ry="11" fill="#9adcf5" opacity="0.75"/>
      <text x="60" y="194" font-size="14">🐟</text>
      <text x="98" y="188" font-size="11">🐠</text>
      <!-- cây táo trái -->
      <rect x="196" y="118" width="11" height="30" rx="4" fill="#8a5a33"/>
      <circle cx="201" cy="103" r="27" fill="#4e9d3a"/>
      <circle cx="185" cy="115" r="18" fill="#5fb349"/>
      <circle cx="218" cy="114" r="18" fill="#5fb349"/>
      <circle cx="192" cy="100" r="4" fill="#e74c3c"/>
      <circle cx="211" cy="110" r="4" fill="#e74c3c"/>
      <circle cx="203" cy="120" r="4" fill="#e74c3c"/>
      <!-- nhà kho -->
      <rect x="310" y="96" width="120" height="80" rx="4" fill="#d94f3d"/>
      <polygon points="302,100 370,52 438,100" fill="#4a7dc9"/>
      <rect x="302" y="96" width="136" height="7" rx="3" fill="#fff8ec"/>
      <rect x="352" y="66" width="34" height="24" rx="3" fill="#d94f3d" stroke="#fff8ec" stroke-width="3"/>
      <circle cx="369" cy="78" r="6" fill="#ffd257"/>
      <rect x="344" y="120" width="52" height="56" rx="3" fill="#fff8ec"/>
      <line x1="346" y1="122" x2="394" y2="174" stroke="#d94f3d" stroke-width="4"/>
      <line x1="394" y1="122" x2="346" y2="174" stroke="#d94f3d" stroke-width="4"/>
      <!-- silo -->
      <rect x="446" y="88" width="28" height="88" rx="12" fill="#7ea7d8"/>
      <ellipse cx="460" cy="88" rx="14" ry="9" fill="#5b88bf"/>
      <!-- cối xay gió -->
      <polygon points="583,178 619,178 610,96 592,96" fill="#f3e2c3" stroke="#d8b98a" stroke-width="2"/>
      <polygon points="580,96 622,96 601,74" fill="#d94f3d"/>
      <rect x="595" y="150" width="12" height="28" rx="5" fill="#8a5a33"/>
      <g class="mill">
        <g fill="#ffffff" stroke="#d0d0d0" stroke-width="2">
          <rect x="598.5" y="46" width="5" height="50" rx="2.5"/>
          <rect x="601" y="93.5" width="50" height="5" rx="2.5"/>
          <rect x="598.5" y="98" width="5" height="50" rx="2.5"/>
          <rect x="551" y="93.5" width="50" height="5" rx="2.5"/>
        </g>
        <circle cx="601" cy="96" r="6" fill="#b5854f"/>
      </g>
      <!-- rào trắng -->
      <rect x="290" y="182" width="250" height="4" rx="2" fill="#fdfdf5"/>
      <rect x="290" y="192" width="250" height="4" rx="2" fill="#fdfdf5"/>
      <g fill="#fdfdf5">
        <rect x="295" y="176" width="7" height="26" rx="3"/><rect x="330" y="176" width="7" height="26" rx="3"/>
        <rect x="365" y="176" width="7" height="26" rx="3"/><rect x="400" y="176" width="7" height="26" rx="3"/>
        <rect x="435" y="176" width="7" height="26" rx="3"/><rect x="470" y="176" width="7" height="26" rx="3"/>
        <rect x="505" y="176" width="7" height="26" rx="3"/><rect x="533" y="176" width="7" height="26" rx="3"/>
      </g>
      <!-- thú + hoa -->
      <text x="480" y="172" font-size="24">🐄</text>
      <text x="648" y="196" font-size="20">🐑</text>
      <text x="700" y="188" font-size="16">🐑</text>
      <text x="252" y="200" font-size="16">🐔</text>
      <circle cx="150" cy="206" r="4" fill="#ffd257"/><circle cx="166" cy="210" r="3" fill="#ff8a80"/>
      <circle cx="565" cy="208" r="4" fill="#ff8a80"/><circle cx="740" cy="204" r="4" fill="#ffd257"/>
      <!-- bảng gỗ + logo -->
      <g transform="rotate(-2 135 118)">
        <rect x="30" y="66" width="216" height="98" rx="16" fill="#a06e40" stroke="#7a4e28" stroke-width="5"/>
        <rect x="40" y="76" width="196" height="78" rx="11" fill="#b5854f"/>
        <circle cx="48" cy="82" r="3" fill="#6b4326"/><circle cx="228" cy="82" r="3" fill="#6b4326"/>
        <text x="138" y="112" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="37"
              fill="#58b32c" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Nông Trại</text>
        <text x="138" y="150" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="40"
              fill="#ffb92e" stroke="#ffffff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Vui Vẻ</text>
        <text x="232" y="158" font-size="18">🌼</text>
      </g>
    </svg>
  </div>

  <div id="app">
    <div class="boot">🌱 Đang tải nông trại…</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
